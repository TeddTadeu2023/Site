<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada | Prof. Tedd Tadeu</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    /* Estilos embutidos: esta página pode ser exibida em qualquer caminho do site. */
    :root { --bg: #f5f7fa; --text: #1b1f24; --muted: #5b6573; --accent: #0078d4; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1419; --text: #e8edf2; --muted: #9aa6b4; --accent: #3a9fe8; } }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background: var(--bg); color: var(--text); text-align: center;
    }
    .logo { display: inline-grid; place-items: center; width: 64px; height: 64px; margin-bottom: 20px; border-radius: 16px;
      color: #fff; font-weight: 800; font-size: 1.5rem; background: linear-gradient(135deg, #0078d4, #00a4ef 60%, #107c10); }
    h1 { font-size: clamp(2.5rem, 8vw, 4rem); margin: 0; color: var(--accent); }
    p { color: var(--muted); max-width: 420px; margin: 8px auto 24px; }
    a { display: inline-block; background: #0078d4; color: #fff; padding: 12px 22px; border-radius: 10px; font-weight: 600; text-decoration: none; }
    a:hover { background: #005a9e; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">TT</div>
    <h1>404</h1>
    <p>Esta página não existe ou foi movida. Que tal voltar para os artigos?</p>
    <a href="/">Voltar ao blog</a>
  </main>
</body>
</html>
